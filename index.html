<style>
:root { --bg:#f8f5fd; --card:#fff; --ink:#2a2433; --muted:#857b93; --line:#e9e2f5; --accent:#8f6ad6; --soft:#efe8fb;

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(env(safe-area-inset-top) + 14px) 16px 8px; border-bottom:1px solid var(--line); }
h1 { margin:0; font-size:24px; }
.resumo { display:flex; gap:6px; margin:8px 0 2px; overflow-x:auto; scrollbar-width:none; }
.resumo::-webkit-scrollbar { display:none; }
.pill { flex:none; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-size:13px; font-weight:600; }
.pill b { color:var(--accent); }
.chips { display:flex; gap:8px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }

.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
main { padding:6px 16px calc(env(safe-area-inset-bottom) + 90px); max-width:720px; margin:0 auto; }
h2 { font-size:18px; margin:24px 4px 8px; display:flex; align-items:center; gap:8px; }
h2 small { color:var(--muted); font-weight:500; font-size:14px; }
.nota { color:var(--muted); font-size:14px; margin:-4px 4px 10px; }
.legendas { margin:0 0 10px; display:flex; flex-direction:column; gap:6px; }
.copia { text-align:left; border:1px dashed var(--accent); background:var(--soft); color:var(--ink); border-radius:12px; padding:8px 11px; font:14px/1.35 inherit; white-space:pre-wrap; word-break:break-word; }

.card { background:var(--card); border:1px solid var(--line); border-radius:18px; margin:0 0 10px; overflow:hidden; }
.card.gravado { border-color:var(--amber); }
.card.postado { opacity:.6; }
.topo { display:flex; align-items:center; gap:10px; padding:14px 14px 10px; cursor:pointer; }
.topo .t { flex:1; font-weight:700; }
.topo .s { display:block; color:var(--muted); font-weight:500; font-size:13px; margin-top:2px; }
.seta { color:var(--muted); transition:.2s; }
.card.aberto .seta { transform:rotate(90deg); }
.botoes { display:flex; gap:8px; padding:0 14px 14px; }
.botoes button { flex:1; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:10px 6px; font:600 15px/1 inherit; }
.botoes button.on.g { background:var(--ambersoft); border-color:var(--amber); color:var(--amber); }
.botoes button.on.p { background:var(--oksoft); border-color:var(--ok); color:var(--ok); }
.conteudo { display:none; padding:0 14px 12px; border-top:1px solid var(--line); font-size:15px; }
.card.aberto .conteudo { display:block; }
.conteudo table { width:100%; border-collapse:collapse; font-size:13.5px; margin:8px 0; }
.conteudo th, .conteudo td { border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; vertical-align:top; }
.conteudo code { background:var(--soft); color:var(--ink); border-radius:8px; padding:2px 7px; font:14px/1.4 inherit; cursor:pointer; }
.conteudo code::after { content:" 📋"; font-size:12px; }
.conteudo ul, .conteudo ol { padding-left:20px; margin:6px 0; }
.conteudo h3 { font-size:15px; margin:12px 0 4px; }
.montar { background:var(--soft); border-radius:12px; padding:9px 11px; font-size:14px; margin-top:8px; }
details.info { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px 14px; margin:12px 0 0; font-size:15px; }
details.info summary { font-weight:700; cursor:pointer; }
.vazio { text-align:center; color:var(--muted); padding:36px 8px; }
footer { text-align:center; color:var(--muted); font-size:13px; margin-top:24px; }
footer button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:8px 14px; margin:4px; font:600 14px/1 inherit; }
#toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translateX(-50%) translateY(30px); background:var(--ok); color:#fff; font-weight:700; padding:12px 20px; border-radius:999px; opacity:0; transition:.25s; pointer-events:none; }

</style>

const DADOS = {"info": "## 🗓️ Divisão pra poupar as mãos\n- **SÁBADO, no fundo infinito, com o flash colorido:** todos os vídeos de ⚡ **cortes no ritmo** (você grava, eu monto). A montagem fica igual, só muda o produto.\n- **DOMINGO, na mesa com luz quente:** todos os vídeos de 🕯️ **ASMR calminho** (1 take cada, sem edição).\n\n**Lembretes:**\n- ⚡ **Cortes no ritmo:** cada take tem **~5 s**, grave **na ordem**, salve em `MONTAR/<produto>` e me fale \"monta o …\". O ⏱️ é quanto o take dura no vídeo pronto.\n- 🕯️ **ASMR:** é **1 take contínuo de 10 a 15 s**, com o microfone pertinho, sem fala, e a música suave entra no TikTok.\n- ☑️ **Antes de gravar:** confira o **\"Ganhe R$ X por venda\"** de cada anúncio.\n\n---\n\n\n## 🎯 O seu jeito: o produto em vários ângulos e distâncias (Ge, 07/10)\nSuper close, de lado, de frente, a sola, de longe e de perto. A regra do tempo fica simples:\n- 🔍 **Quanto mais PERTO, mais RÁPIDO:** super close e textura = **0,6 a 1 s**.\n- 🖼️ **Quanto mais LONGE, mais TEMPO:** produto inteiro e cena aberta = **2 a 3 s**.\n- ✋ **Quando tem movimento, segura até ele terminar:** virar pra mostrar a sola, abrir, borrifar = **2,5 a 4 s**.\n\n\n## 🙌 Quem faz o quê\n- 🎥 **Você:** grava cada take com **uns 5 segundos** e o celular parado no tripé. Pode também ser foto.\n- ✂️ **Eu:** monto tudo: o trailer de abertura, o tempo certo de cada cena e o vídeo final em 1080×1920. **Você não edita nada.**\n- 🎵 **Você:** põe a música viral no TikTok na hora de postar. O vídeo sai sem som.\n\n\n## 📲 Como me mandar os takes\n1. Grave **na ordem do cartão**. O iPhone numera os arquivos, e eu monto nessa ordem.\n2. No app **Fotos**, selecione os takes e toque em **Compartilhar** → **Salvar em Arquivos**.\n3. Vá em **iCloud Drive → FOTOS DIA → CONTA VENDAS 2 → MONTAR** e crie uma pasta com o nome do produto (ex.: `bolsa tote preta`).\n4. Me escreva **\"monta a bolsa tote preta\"**. Em ~1 minuto, o vídeo `MONTADO_…mp4` aparece na mesma pasta.\n\n\n## 💡 Luz e fundo\n- as de unha na barriguinha do urso.\n- 📺 **Texto:** `o copo mais fofo que eu já tive 🐻🧃`"}, {"id": "ursinho-cortes-no-ritmo-presente-de-natal-fundo", "titulo": "⚡ Cortes no ritmo · \"presente de Natal\" · fundo infinito branco", "sub": "", "formato": "cortes", "md": "| # | take | luz | ⏱️ |\n|---|---|---|---|\n| 1 | De longe: o copo vazio no centro | branca | 2,0 s |\n| 2 | Super close no rostinho do urso | rosa | 0,7 s ⚡ |\n| 3 | Bombons caindo dentro | âmbar | 3,0 s 🐢 |\n| 4 | A tampa entrando | verde | 1,5 s |\n| 5 | O copo com um laço já pronto ao lado | vermelha | 1,3 s |\n| 6 | Close nos bombons pelo vidro | branca | 0,6 s ⚡ |\n| 7 | A mão gira o copo devagar | verde | 2,4 s |\n| 8 | Final de longe, com luz vermelha e verde | vermelha | 2,5 s |\n\n✂️ Ritmo: `2,0.7,3,1.5,1.3,0.6,2.4,2.5` · 📺 Texto: `presente de Natal resolvido 🎁🐻`\n\n---"}], "legendas": [], "nota": ""}, {"id": "corrente", "emoji": "⛓️", "nome": "Bolsa de alça de corrente", "pasta": "bolsa corrente", "cards": [{"id": "corrente-asmr-cetim-prata-perolado-e-led-mbar", "titulo": "🕯️ ASMR · cetim prata perolado e LED âmbar", "sub": "", "formato": "asmr", "md": "- 📷 **Câmera:** de cima e bem perto.\n- ✋ **Movimento:** a mão levanta a corrente e deixa ela cair devagar no cetim, elo por elo. Faz isso 2 vezes.\n- 📺 **Texto:** `ouve essa corrente ✨`"}, {"id": "corrente-cortes-no-ritmo-fundo-infinito-preto-a", "titulo": "⚡ Cortes no ritmo · fundo infinito PRETO (a corrente brilha com a luz colorida)", "sub": "", "formato": "cortes", "md": "| # | take | luz | ⏱️ |\n|---|---|---|---|\n| 1 | De longe: a bolsa no centro | rosa | 2,5 s |\n| 2 | Super close na corrente | azul | 0,7 s ⚡ |\n| 3 | A mão levanta pela corrente, e a bolsa balança | âmbar | 2,4 s |\n| 4 | A mão abre o fecho | lilás | 1,8 s |\n| 5 | Close no fecho | branca | 0,6 s ⚡ |\n| 6 | Batom e chave entrando | rosa | 2,5 s 🐢 |\n| 7 | De lado | verde | 1,3 s |\n| 8 | Final de longe | vermelha | 2,5 s |\n\n✂️ Ritmo: `2.5,0.7,2.4,1.8,0.6,2.5,1.3,2.5`
